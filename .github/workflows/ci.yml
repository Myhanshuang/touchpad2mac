name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test -p touchpad-core -p touchpad-windows --locked
      - run: cargo build --release -p touchpadctl --locked
      - uses: actions/upload-artifact@v4
        with:
          name: touchpadctl-windows-x86_64
          path: target/release/touchpadctl.exe
          if-no-files-found: error

  uinput-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Enable uinput
        run: |
          sudo modprobe uinput
          sudo chmod a+rw /dev/uinput
      - name: Kernel software-in-the-loop test
        run: |
          # The virtual event node is created during the test and is normally
          # root:input. Run only this isolated kernel-SIL job as root instead
          # of weakening permissions on every host /dev/input/event* node.
          sudo env PATH="$PATH" HOME="$HOME" CARGO_HOME="$CARGO_HOME" \
            TOUCHPAD2MAC_RUN_UINPUT=1 \
            cargo test -p touchpad-testkit --test uinput_smoke --locked -- --nocapture

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
